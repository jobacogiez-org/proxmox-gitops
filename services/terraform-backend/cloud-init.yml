#cloud-config
# alloy a besoin du hostname pour bien envoyer les logs
hostname: ${hostname}
preserve_hostname: false

users:
  - name: admin
    groups: docker
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
packages:
  - qemu-guest-agent
  - libicu76
  - git
  - curl 
  - tree
  - pip 
  - pipx 
  - gpg
  - python3
runcmd: 
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - curl -fsSl https://get.docker.com | sh
  # Insertion des credentials S3 stockés dans la source de vérité (SOPS)
  - sudo mkdir -p /opt/terraform-backend
  - POSTGRES_PASSWORD="$(openssl rand -hex 32)" && echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" | sudo tee -a /opt/terraform-backend/.env >/dev/null
  - echo "S3_ACCESS_KEY=${s3_access_key}" | sudo tee -a /opt/terraform-backend/.env >/dev/null
  - echo "S3_SECRET_KEY=${s3_secret_key}" | sudo tee -a /opt/terraform-backend/.env >/dev/null


