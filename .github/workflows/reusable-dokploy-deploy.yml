name: Déploiement dokploy réutilisable

on:
  workflow_call:
    inputs:
      project_name:
        description: "Nom du projet (par défaut: nom du repo)"
        required: false
        type: string
      app_name:
        description: "Nom de l'application (par défaut: nom du repo)"
        required: false
        type: string
      compose_paths:
        description: "Chemin du docker-compose.yml"
        required: false
        type: string
        default: "./docker-compose.yml"
    secrets:
      DOKPLOY_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Install Dokploy CLI & jq
        run: |
          sudo npm install -g @dokploy/cli
          sudo apt-get install -y jq

      - name: Configuration dokploy (Logique upsert)
        env:
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_HOST: http://172.16.10.11:3000
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT_NAME: ${{ inputs.project_name || github.event.repository.name }}
          APP_NAME: ${{ inputs.app_name || github.event.repository.name }}
          COMPOSE_PATH: ${{ inputs.compose_paths }}
          FULL_REPO_NAME: ${{ github.repository }}
        run: |
          # 1. Connexion
          sudo dokploy auth --token "$DOKPLOY_TOKEN" --url "$DOKPLOY_HOST"

          OWNER="${FULL_REPO_NAME%%/*}"
          REPOSITORY="${FULL_REPO_NAME#*/}"

          # 2.recup ou creer le projet
          PROJECT_ID=$(dokploy project all --json | jq -r ".[] | select(.name == \"$PROJECT_NAME\") | (.projectId // .id)" | head -n 1)
          if [ -z "$PROJECT_ID" ]; then
            echo "Création du projet $PROJECT_NAME..."
            PROJECT_ID=$(dokploy project create --name "$PROJECT_NAME" --json | jq -r '.projectId // .project.projectId // .id')
          fi
          echo "Project ID: $PROJECT_ID"

          # 3.recup ou creer l'environnement production
          ENVIRONMENT_ID=$(dokploy environment by-project-id --projectId "$PROJECT_ID" --json | jq -r ".[] | select(.name == \"production\") | (.environmentId // .id)" | head -n 1)
          if [ -z "$ENVIRONMENT_ID" ]; then
            echo "Création de l'environnement production..."
            ENVIRONMENT_ID=$(dokploy environment create --name "production" --projectId "$PROJECT_ID" --json | jq -r '.environmentId // .id')
          fi
          echo "Environment ID: $ENVIRONMENT_ID"

          # 4.recup ou creer le compose
          COMPOSE_ID=$(dokploy compose search --environmentId "$ENVIRONMENT_ID" --json | jq -r ".[] | select(.name == \"$APP_NAME\") | (.composeId // .id)" | head -n 1)
          if [ -z "$COMPOSE_ID" ]; then
            echo "Création du compose $APP_NAME..."
            COMPOSE_ID=$(dokploy compose create --name "$APP_NAME" --environmentId "$ENVIRONMENT_ID" --json | jq -r '.composeId // .id')
          fi
          echo "Compose ID: $COMPOSE_ID"

          # Configuration du compose
          dokploy compose update --composeId "$COMPOSE_ID" \
            --sourceType "github" \
            --owner "$OWNER" \
            --repository "$REPOSITORY" \
            --branch "main" \
            --composeType "docker-compose" \
            --composePath "$COMPOSE_PATH" \
            --autoDeploy

          # et la maintenant il va observer le dépôt à chaque changement pour update