name: Appel d'un déploiement dokploy pour test (ici docker comspose)

on:
  push:
    branches: [main, 19*]
  workflow_dispatch:

jobs:
  deploy:
    uses: jobacogiez-org/proxmox-gitops/.github/workflows/reusable-dokploy-deploy.yml@19-poc-pour-la-cicd-dokploy
    with:
      compose_paths: ./services/test-kanboard-dokploy/docker-compose.yml
    secrets:
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}