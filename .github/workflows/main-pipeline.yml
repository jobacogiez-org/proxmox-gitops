name: "CI/CD Pipeline (Terraform & Services)"

on:
  push:
    branches: [ main, perso ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis-checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse checkov
        run: make lint-checkov

  static-analysis-tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse TFLint
        run: make lint-tflint

  static-analysis-hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: services/**/Dockerfile

  terraform-deploy:
    # S'exécute sur le runner self-hosted (qui a accès au réseau Proxmox/S3)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/perso'
    needs: [ static-analysis-checkov, static-analysis-tflint, static-analysis-hadolint ]
    runs-on: self-hosted
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Verify SOPS & Terraform
        run: |
          which sops || (curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /usr/local/bin/sops && chmod +x /usr/local/bin/sops)
          sops --version
          terraform --version

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/proxmox_terraform
          chmod 600 ~/.ssh/proxmox_terraform
          ssh-keygen -y -f ~/.ssh/proxmox_terraform > ~/.ssh/proxmox_terraform.pub
          chmod 644 ~/.ssh/proxmox_terraform.pub

      - name: Install j2cli
        run: |
          which j2 || sudo apt-get install -y j2cli

      - name: Détecter les changements Terraform
        id: tf_changes
        uses: tj-actions/changed-files@v47
        with:
          files: |
            terraform/environments/production/bootstrap/**
            terraform/environments/production/core/**
            terraform/modules/**
            settings.enc.yml

      # Applique BOOTSTRAP si son dossier ou des fichiers globaux ont changé
      - name: Terraform Apply (Bootstrap)
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/environments/production/bootstrap') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/modules') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'settings.enc.yml')
        run: make tf TF_LAYER=bootstrap ACTION="apply -auto-approve"

      # Applique CORE si son dossier ou des fichiers globaux ont changé
      - name: Terraform Apply (Core)
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/environments/production/core') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/modules') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'settings.enc.yml')
        run: make tf TF_LAYER=core ACTION="apply -auto-approve"

      # Provisionne les conteneurs LXC (admin + docker) si la couche core ou les modules LXC ont changé
      - name: Provisionner les conteneurs LXC
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/environments/production/core') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/modules/lxc') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'ansible/playbooks/bootstrap.yml') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'ansible/inventories/lxc_inventory.yml')
        run: make deploy-lxc

  services-to-deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/perso' || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    needs: [ static-analysis-checkov, static-analysis-tflint, static-analysis-hadolint ]
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && steps.services.outputs.folders || steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Liste des services
        id: services
        uses: philips-labs/list-folder-action@v3.0
        with:
          path: ./services
      - id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v47
        with:
          path: services
          dir_names: true
          dir_names_max_depth: 1
          matrix: true

  ansible:
    if: |
      always() &&
      (needs.terraform-deploy.result == 'success' || needs.terraform-deploy.result == 'skipped') &&
      needs.services-to-deploy.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/perso' || github.ref == 'refs/heads/main') &&
      needs.services-to-deploy.outputs.services != '[]'
    needs: [ terraform-deploy, services-to-deploy ]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services-to-deploy.outputs.services) }}
        exclude:
          - service: authentik
          - service: base-vm
          - service: kanboard
          - service: nextcloud
          - service: rasdaemon
          - service: template-vm
          - service: wgeasy
          - service: gh-runner-compose
    steps:
      - uses: actions/checkout@v4

      - name: "Setup SSH pour ${{ matrix.service }}"
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_KEY }}
          log-public-key: false

      - name: Désactiver HostKeyChecking
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Vérifier l'environnement Ansible
        run: |
          ansible-playbook --version

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: "Déploiement de ${{ matrix.service }}"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          make deploy-compose-ci SERVICE=${{ matrix.service }}
